services:
  app:
    build:
      target: deps
    working_dir: /app
    command: npm run dev -- -H 0.0.0.0 -p 3000
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
    environment:
      WATCHPACK_POLLING: "true"

  admin:
    build:
      target: deps
    working_dir: /app
    command: npm run dev -- -H 0.0.0.0 -p 3000
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    environment:
      WATCHPACK_POLLING: "true"

  api:
    build:
      target: deps
    working_dir: /app
    command: npm run dev -- -H 0.0.0.0 -p 3000
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    environment:
      WATCHPACK_POLLING: "true"

  marketing:
    build:
      target: deps
    working_dir: /app
    command: npm run dev -- -H 0.0.0.0 -p 3000
    volumes:
      - ./marketing:/app
      - marketing_node_modules:/app/node_modules
    environment:
      WATCHPACK_POLLING: "true"

volumes:
  app_node_modules:
  admin_node_modules:
  api_node_modules:
  marketing_node_modules:
